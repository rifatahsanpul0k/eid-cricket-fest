# ==============================================
# APPLICATION
# ==============================================

spring.application.name=eid-cricket-fest-backend

# ==============================================
# SERVER
# ==============================================

server.port=${PORT:8080}
server.shutdown=graceful

spring.lifecycle.timeout-per-shutdown-phase=20s

# ==============================================
# DATABASE / JPA COMMON
# ==============================================

# Flyway controls the schema. Hibernate must never create/update it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==============================================
# REQUEST LOGGING
# ==============================================

logging.pattern.level=%5p [requestId=%X{requestId:-}]

# ==============================================
# PAGINATION
# ==============================================

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ==============================================
# ACTUATOR
# ==============================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# ==============================================
# JWT
# ==============================================

app.jwt.issuer=${JWT_ISSUER:eid-cricket-fest}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
app.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:30d}

# ==============================================
# AUTH RATE LIMITING
# ==============================================

app.rate-limit.auth.cache-max-size=${AUTH_RATE_LIMIT_CACHE_MAX_SIZE:10000}
app.rate-limit.auth.cache-expire-after-access=${AUTH_RATE_LIMIT_CACHE_TTL:2h}

app.rate-limit.auth.login-ip.capacity=${AUTH_LOGIN_IP_CAPACITY:60}
app.rate-limit.auth.login-ip.refill-tokens=${AUTH_LOGIN_IP_REFILL_TOKENS:60}
app.rate-limit.auth.login-ip.refill-period=${AUTH_LOGIN_IP_REFILL_PERIOD:1m}

app.rate-limit.auth.login-identity.capacity=${AUTH_LOGIN_IDENTITY_CAPACITY:10}
app.rate-limit.auth.login-identity.refill-tokens=${AUTH_LOGIN_IDENTITY_REFILL_TOKENS:10}
app.rate-limit.auth.login-identity.refill-period=${AUTH_LOGIN_IDENTITY_REFILL_PERIOD:1m}

app.rate-limit.auth.register-ip.capacity=${AUTH_REGISTER_IP_CAPACITY:10}
app.rate-limit.auth.register-ip.refill-tokens=${AUTH_REGISTER_IP_REFILL_TOKENS:10}
app.rate-limit.auth.register-ip.refill-period=${AUTH_REGISTER_IP_REFILL_PERIOD:1h}

app.rate-limit.auth.refresh-ip.capacity=${AUTH_REFRESH_IP_CAPACITY:60}
app.rate-limit.auth.refresh-ip.refill-tokens=${AUTH_REFRESH_IP_REFILL_TOKENS:60}
app.rate-limit.auth.refresh-ip.refill-period=${AUTH_REFRESH_IP_REFILL_PERIOD:1m}
