# ==============================================
# DATABASE
# ==============================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}

# ==============================================
# JWT
# ==============================================

app.jwt.private-key=${JWT_PRIVATE_KEY_LOCATION}
app.jwt.public-key=${JWT_PUBLIC_KEY_LOCATION}

# ==============================================
# CORS / WEBSOCKET
# ==============================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS}}

# ==============================================
# AUTH RATE LIMITING
# ==============================================

app.rate-limit.auth.enabled=${AUTH_RATE_LIMIT_ENABLED:true}

# ==============================================
# API DOCUMENTATION
# ==============================================

springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

# ==============================================
# ERROR SAFETY
# ==============================================

server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never

# ==============================================
# LOGGING
# ==============================================

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.eidcricketfest=${LOG_LEVEL_APP:INFO}

spring.jpa.show-sql=false

# ==============================================
# ACTUATOR
# ==============================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# ==============================================
# FORWARDED HEADERS
# ==============================================

server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
