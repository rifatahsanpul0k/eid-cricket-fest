# ==============================================
# LOCAL DATABASE
# ==============================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/eid_cricket_fest}
spring.datasource.username=${DB_USERNAME:eid_admin}
spring.datasource.password=${DB_PASSWORD:eid_dev_password}

# ==============================================
# API DOCUMENTATION
# ==============================================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ==============================================
# CORS / WEBSOCKET
# ==============================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000}

# ==============================================
# JWT
# ==============================================

app.jwt.private-key=${JWT_PRIVATE_KEY_LOCATION:file:.keys/private.pem}
app.jwt.public-key=${JWT_PUBLIC_KEY_LOCATION:file:.keys/public.pem}

# ==============================================
# AUTH RATE LIMITING
# ==============================================

app.rate-limit.auth.enabled=${AUTH_RATE_LIMIT_ENABLED:true}
