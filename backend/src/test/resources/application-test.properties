# ==============================================
# TEST PROFILE
# ==============================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Testcontainers supplies datasource automatically.

# ==============================================
# JWT
# ==============================================

app.jwt.private-key=classpath:keys/test-private.pem
app.jwt.public-key=classpath:keys/test-public.pem

app.jwt.issuer=eid-cricket-fest-test
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=30d

# ==============================================
# WEBSOCKET
# ==============================================

app.websocket.allowed-origins=http://localhost:3000
app.cors.allowed-origins=http://localhost:3000
app.rate-limit.auth.enabled=false

# ==============================================
# ACTUATOR
# ==============================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
